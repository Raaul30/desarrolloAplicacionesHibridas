<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Mercería Rosa - Productos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mercería Rosa</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="listaDeProductos.length === 0" class="mensaje-vacio" style="text-align: center; margin-top: 20px;">
    <p>¡Atención!</p>
    <p>No hay productos disponibles en este momento.</p>
  </div>


  <app-producto-item
    *ngFor="let producto of listaDeProductos"
    [producto]="producto">
  </app-producto-item>

</ion-content>
