<!--
  Color principal:       #FFF8F0  (Crema cálido)
  Color secundario:      #493A35  (Marrón chocolate)
  Color de acento:       #D9A85B  (Dorado suave)
-->
<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Mercería Rosa - Productos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Mercería Rosa</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Tarjeta de bienvenida (Estilos en home.page.scss) -->
  <ion-grid class="tarjeta-bienvenida">
    <ion-row class="ion-align-items-center">
      <ion-col size="12" size-md="4">
        <img src="assets/icon/logo.jpg" alt="Logo Mercería Rosa" />
      </ion-col>
      
      <ion-col size="12" size-md="8" class="ion-text-center">
        <h2>¡Bienvenidos a Mercería Rosa!</h2>
        <ion-button size="small" color="secondary">Contactar</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid class="contenedor-productos">
    <ion-row>
      <ion-col *ngFor="let producto of listaDeProductos" size="12" size-md="6" size-lg="4">
        <app-producto-item [producto]="producto"></app-producto-item>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
