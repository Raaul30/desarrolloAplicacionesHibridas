<ion-card>
  <ion-item>

    <!-- Imagen aleatoria de Picsum -->
    <ion-thumbnail slot="start">
      <img
        [src]="producto.imagen"
        [alt]="producto.nombreProducto"
        loading="lazy"
      />
    </ion-thumbnail>

    <!-- <ion-checkbox
      slot="start"
      [checked]="producto.cantidad > 0">
    </ion-checkbox> -->

    <ion-label [class.tachado]="producto.cantidad <= 0">
      {{ producto.nombreProducto }}
    </ion-label>

    <ion-button (click)="mostrarDetalles()" slot="end" style="--background: #D9A85B; --color: #493A35;">
      Ver
    </ion-button>
  </ion-item>
</ion-card>
